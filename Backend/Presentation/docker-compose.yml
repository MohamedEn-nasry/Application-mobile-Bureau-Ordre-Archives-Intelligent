services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sa123456
      POSTGRES_DB: order_management_archive
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../Database/backup.sql:/docker-entrypoint-initdb.d/backup.sql

  api:
    build:
      context: ..
      dockerfile: Presentation/Dockerfile
    environment:
      ConnectionString: "Host=postgres;Port=5432;Database=order_management_archive;Username=postgres;Password=sa123456"
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "5151:8080"
    depends_on:
      - postgres

volumes:
  postgres_data: